<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectCalculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div id="outer">
       <input id="input" type="text" readonly>
        <div id="button-container">
           <button class="buttons" onclick="
            currentDisplayValue = '';
             document.querySelector(`#input`).value = currentDisplayValue;
            ">C</button>
           <button class="buttons" onclick="
           currentDisplayValue = currentDisplayValue + '1';
           document.querySelector(`#input`).value = currentDisplayValue;
           ">1</button>
           <button class="buttons" onclick="
           currentDisplayValue = currentDisplayValue+'2';
           document.querySelector(`#input`).value = currentDisplayValue;
           ">2</button>
           <button class="buttons" onclick="
           currentDisplayValue = currentDisplayValue + `+`;
           document.querySelector(`#input`).value = currentDisplayValue;
           " >+</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`3`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">3</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`4`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">4</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue + '-';
           document.querySelector(`#input`).value = currentDisplayValue;
           ">-</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`5`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">5</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`6`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">6</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue + `*`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">*</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`7`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">7</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`8`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">8</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue + `/`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">/</button>
           <button class="buttons"  onclick="
           currentDisplayValue = eval(currentDisplayValue);
           document.querySelector(`#input`).value = currentDisplayValue;
           ">=</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue+`9`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">9</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue +`0`;
           document.querySelector(`#input`).value = currentDisplayValue;
           ">0</button>
           <button class="buttons"  onclick="
           currentDisplayValue = currentDisplayValue + '.';
           document.querySelector(`#input`).value = currentDisplayValue;
           ">.</button>
           

        
        </div>
        
    </div>
    <script>
        let currentDisplayValue = '';
        document.querySelector("#input").value = currentDisplayValue;
    </script>
</body>
</html>
